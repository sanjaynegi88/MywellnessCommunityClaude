<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MWC 360 Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console — fixed module rail on the left, working surface on the right; rail becomes a top select on phones. */
:root{
  --bg:#F3F6F3; --panel:#FFFFFF; --ink:#14201A; --muted:#5A6A62; --line:#D9E2DC; --soft:#E5EFE9;
  --accent:#1E6B52; --accent-ink:#FFFFFF; --rail:#13241D; --rail-ink:#CFE0D7; --rail-dim:#7E978B;
  --good:#2E7D32; --warn:#9A5B00; --bad:#B3261E; --info:#2B5C8A; --pet:#7A4E9C;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --panel:#151E1A; --ink:#E2ECE6; --muted:#93A59C; --line:#26332D; --soft:#1B2A23;
  --accent:#5DC49D; --accent-ink:#08130E; --rail:#0A100D; --rail-ink:#CFE0D7; --rail-dim:#6F877B;
  --good:#7BC77F; --warn:#E3A84C; --bad:#F07C73; --info:#82B3E3; --pet:#C29BE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --panel:#151E1A; --ink:#E2ECE6; --muted:#93A59C; --line:#26332D; --soft:#1B2A23;
  --accent:#5DC49D; --accent-ink:#08130E; --rail:#0A100D; --rail-ink:#CFE0D7; --rail-dim:#6F877B;
  --good:#7BC77F; --warn:#E3A84C; --bad:#F07C73; --info:#82B3E3; --pet:#C29BE6; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;padding:0 8px 2px}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--rail-dim);letter-spacing:.04em}
.navgrp{margin-top:16px}
.navgrp h6{margin:0 0 4px;padding:0 8px;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--rail-dim)}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--rail-ink);font:inherit;padding:6px 8px;border-radius:6px;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--accent);color:var(--accent-ink)}
.nav .n{font-family:var(--f-mono);font-size:11px;opacity:.6;width:18px}
.nav .c{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.75}
.mnav{display:none}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-family:var(--f-display);font-weight:500;font-size:16px}
.card h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:6px}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.s{padding:4px 9px;font-size:12px}
.btn.ai::before{content:"✦ ";color:inherit}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);text-align:right}
td .t{font-weight:500}
td .sub{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--f-body);padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)} .pill.mute{color:var(--muted)} .pill.acc{color:var(--accent)} .pill.pet{color:var(--pet)}
.pill.ex{color:var(--muted);border-style:dashed}
.tag{display:inline-block;font:12px var(--f-mono);background:var(--soft);padding:1px 6px;border-radius:4px;margin:0 4px 4px 0}
.muted{color:var(--muted)}
.note{border-left:3px solid var(--warn);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.ok{border-left-color:var(--accent)}
.note.bad{border-left-color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:16px;margin-bottom:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.tools input,.tools select{width:auto}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px}
label.ck input{width:auto;margin-top:3px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(5,12,9,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(760px,100%);display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px}
.aiout{white-space:pre-wrap;font-size:13.5px;background:var(--soft);border-radius:8px;padding:12px;max-height:460px;overflow:auto}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.loop .st{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;min-width:0;cursor:pointer}
.loop .st b{font-weight:500;font-size:12.5px}
.loop .st span{font:11px var(--f-mono);color:var(--muted)}
.loop .ar{color:var(--muted);font-size:12px}
.loop .st.back{border-style:dashed;border-color:var(--accent)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(90px,180px) minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:6px}
.hbar .tr{background:var(--soft);height:10px;border-radius:5px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.hbar .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat{display:flex;flex-direction:column;height:520px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.chat .top{padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;font-size:13.5px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:3px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
pre.code{background:var(--rail);color:#D6E6DD;font:12px/1.55 var(--f-mono);padding:12px;border-radius:8px;overflow-x:auto;margin:0;white-space:pre}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60}
.status{font:11.5px var(--f-mono);color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px}
.flow span{padding:2px 7px;border-radius:4px;background:var(--soft);color:var(--muted)}
.flow span.on{background:var(--accent);color:var(--accent-ink)}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mnav{display:flex;gap:8px;align-items:center;background:var(--rail);color:var(--rail-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--rail)}
  .mnav .brand{font-size:16px;padding:0;white-space:nowrap}
  .mnav select{background:var(--rail);color:var(--rail-ink);border-color:var(--rail-dim)}
  .head h1{font-size:23px}
  .hbar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0}[hidden]{display:none!important}
</style>

<div class="mnav"><div class="brand">MWC 360</div><select id="mnavSel" aria-label="Module"></select></div>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="modalRoot"></div>

<script>
/* ============================================================
   MWC 360 — unified AI business, marketing & customer intelligence console
   Data: artifact `db` capability (shared, persistent). AI: `sample` capability.
   ============================================================ */
const MODULES = [
  {g:"Operate", id:"dashboard", n:"00", label:"Command Center"},
  {g:"Operate", id:"automation", n:"⟳", label:"Automation & Tasks", c:"tasks"},
  {g:"Intelligence", id:"research", n:"01", label:"Market Research", c:"research"},
  {g:"Intelligence", id:"ads", n:"02", label:"Ad Intelligence", c:"ads"},
  {g:"Intelligence", id:"competitors", n:"03", label:"Competitor Sites", c:"competitors"},
  {g:"Intelligence", id:"communities", n:"03b", label:"Communities", c:"communities"},
  {g:"Offers", id:"offers", n:"04", label:"Offer Pipeline", c:"offers"},
  {g:"Offers", id:"approvals", n:"05", label:"Approval Gateway"},
  {g:"Publish", id:"content", n:"06", label:"Content Studio", c:"content"},
  {g:"Publish", id:"social", n:"07", label:"Social & Creatives", c:"social"},
  {g:"Publish", id:"structure", n:"06b", label:"Site Structure", c:"plans"},
  {g:"Customers", id:"chatbot", n:"08", label:"Chatbot", c:"chats"},
  {g:"Customers", id:"crm", n:"09", label:"Customer Database", c:"contacts"},
  {g:"Customers", id:"segments", n:"10", label:"Segments & Leads"},
  {g:"Customers", id:"email", n:"11", label:"Email Marketing", c:"campaigns"},
  {g:"Learn", id:"analytics", n:"12", label:"Analytics", c:"metrics"},
  {g:"Learn", id:"learning", n:"13", label:"Learning Engine", c:"insights"},
  {g:"Setup", id:"setup", n:"⚙", label:"Integrations & Plan"},
];
const COLLS = ["research","ads","competitors","offers","content","social","contacts","campaigns","metrics","insights","audit","platforms","chats","phases","tasks","communities","plans","creatives"];
const S = {}; COLLS.forEach(c => S[c] = new Map());
let DB = null, SAMPLE = null, USER = null, dbState = "connecting", view = "dashboard";
let modalOpen = false, dirty = false;
/* Server mode: the console is served by the MWC 360 platform at /admin and talks to its API. */
const API_MODE = location.pathname.startsWith("/admin");
let TOKEN = null;
async function apiFetch(method, path, body){
  const res = await fetch(path, {method, headers:{"Content-Type":"application/json", Authorization:"Bearer "+TOKEN}, body: body===undefined?undefined:JSON.stringify(body)});
  const data = await res.json().catch(()=>({}));
  if (res.status===401) { try{localStorage.removeItem("mwc360_token");}catch(e){} }
  if (!res.ok) throw new Error(data.error || ("HTTP "+res.status));
  return data;
}
async function reloadColl(c){ if (c==="audit") { const a = await apiFetch("GET","/api/audit?limit=300"); S.audit = new Map(a.map(x=>[x.id,x])); return; } const rows = await apiFetch("GET","/api/"+c+"?limit=5000"); S[c] = new Map(rows.map(r=>[r.id,r])); }
async function reloadAll(){ await Promise.all(COLLS.map(c=>reloadColl(c).catch(()=>{}))); scheduleRender(); }

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now = () => new Date().toISOString();
const day = iso => iso ? String(iso).slice(0,10) : "";
const all = c => [...S[c].values()].sort((a,b) => String(b.updatedAt||b.createdAt||"").localeCompare(String(a.updatedAt||a.createdAt||"")));
const byId = (c,id) => S[c].get(id);
const count = (arr, fn) => arr.reduce((m,x) => { const k = fn(x); if (k) (Array.isArray(k)?k:[k]).forEach(kk => m[kk]=(m[kk]||0)+1); return m; }, {});
const clean = o => JSON.parse(JSON.stringify(o));
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),2600); }
const exTag = o => o.example ? ` <span class="pill ex" title="Example record — replace with real data">example</span>` : "";

/* ---------- persistence ---------- */
async function save(c, obj){
  if (API_MODE) {
    if (c==="audit") return obj;
    try {
      const isNew = !obj.id || !S[c].has(obj.id);
      const r = isNew ? await apiFetch("POST","/api/"+c, obj) : await apiFetch("PATCH",`/api/${c}/${obj.id}`, obj);
      S[c].set(r.id, r); scheduleRender(); return r;
    } catch(e){ setTimeout(()=>toast(e.message), 300); return null; }
  }
  obj.id = obj.id || uid(); obj.updatedAt = now(); obj.createdAt = obj.createdAt || obj.updatedAt;
  const body = clean(obj);
  S[c].set(obj.id, body);
  if (DB) { try { await DB.collection(c).doc(obj.id).set(body); } catch(e){ toast(e.code==="quota_exceeded" ? "Storage is full — delete old records first." : "Could not save: " + (e.message||e.code)); } }
  else persistLocal();
  scheduleRender();
  return body;
}
async function del(c, id){
  if (API_MODE) { try { await apiFetch("DELETE",`/api/${c}/${id}`); S[c].delete(id); scheduleRender(); } catch(e){ toast(e.message); } return; }
  S[c].delete(id);
  if (DB) { try { await DB.collection(c).doc(id).delete(); } catch(e){ toast("Could not delete: " + (e.message||e.code)); } }
  else persistLocal();
  scheduleRender();
}
/* Local mode (no shared database): keep data in this browser */
function persistLocal(){ LS.set("mwc360_data", JSON.stringify(Object.fromEntries(COLLS.map(c => [c, [...S[c].values()]])))); }
function loadLocal(){
  let d = null; try { d = JSON.parse(LS.get("mwc360_data") || "null"); } catch(e){}
  if (d) { COLLS.forEach(c => { S[c] = new Map((d[c]||[]).map(o => [o.id, o])); }); return; }
  // first run: the platform register and build plan from the brief
  [["awin","Awin","Nutra","To verify","Verify account & programme access; identify API and report exports."],["digistore24","Digistore24","Nutra","To verify","Verify access; check per-vendor approval and traffic restrictions."],["clickbank","ClickBank","Nutra","To verify","Verify access; confirm available API and data export."],["chewy-impact","Chewy via Impact","Pet","To verify","Verify programme access in Impact; check promotional rules."],["petco","Petco (via Impact)","Pet","Rejected","Signup application was rejected. Keep inactive unless a new application is approved."],["zooplus","Zooplus","Pet","To confirm","Affiliate account and access route need confirmation."]]
    .forEach(([id,name,vertical,accountStatus,notes]) => S.platforms.set(id, {id,name,vertical,accountStatus,notes,api:"Unknown",twoFA:false,vault:"Encrypted vault",createdAt:now()}));
  [["1","Architecture & foundation","Preeti + Sanjay"],["2","Market intelligence & affiliate management","Preeti"],["3","Website content automation","Preeti + Sanjay"],["4","Social media & advertising intelligence","Preeti + Sanjay"],["5","Chatbot & customer intelligence","Preeti + Sanjay"],["6","Email marketing","Preeti + Sanjay"],["7","Analytics & continuous optimisation","Sanjay + Preeti"]]
    .forEach(([n,title,owner]) => S.phases.set("p"+n, {id:"p"+n,n,title,owner,status:"Not started",scope:"",acceptance:"See README / brief section 12–13."}));
  persistLocal();
}
async function audit(action, ref, detail){ await save("audit", {action, ref, detail, by: whoName}); }
let whoName = "Team member";

/* ---------- AI wrapper ----------
   Inside Claude: the `sample` capability.
   Outside Claude (file opened locally / self-hosted test): the Anthropic API with a key the
   user enters, kept only in this browser. For production, route through your own backend. */
const LS = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} } };
let KEY_AI = null;
function makeApiSampler(){
  const call = async (input, opts={}) => { const prompt = typeof input==="string" ? input : input.map(t=>(t.role==="user"?"":"Assistant: ")+t.content).join("\n\n"); const r = await apiFetch("POST","/api/ai/complete",{prompt, tier:opts.modelTier==="quick"?"quick":"default"}).catch(e=>{ throw {code:"upstream_error", message:e.message}; }); opts.onText && opts.onText({text:r.text, delta:r.text}); return {text:r.text, truncated:false}; };
  call.json = async (input, opts={}) => (await apiFetch("POST","/api/ai/json",{prompt:input, tier:opts.modelTier==="quick"?"quick":"default"}).catch(e=>{ throw {code:"upstream_error", message:e.message}; })).value;
  return call;
}
function loadKeyAi(){ if (API_MODE) { KEY_AI = makeApiSampler(); return; } const k = LS.get("mwc360_api_key"); KEY_AI = k ? makeKeySampler(k, LS.get("mwc360_model") || "claude-sonnet-5-5") : null; }
function makeKeySampler(key, model){
  async function call(input, opts={}){
    let msgs = typeof input === "string" ? [{role:"user", content:input}] : input.map(t=>({role:t.role, content:t.content}));
    const merged = []; msgs.forEach(m => { const last = merged[merged.length-1]; if (last && last.role===m.role) last.content += "\n\n" + m.content; else merged.push({...m}); });
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", signal: opts.signal,
        headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({model: opts.modelTier==="quick" ? (LS.get("mwc360_model_quick") || "claude-haiku-5-5") : model, max_tokens: 4096, messages: merged}) });
    } catch(e){ throw {code: e.name==="AbortError" ? "cancelled" : "network", message: String(e.message||e)}; }
    if (!res.ok) { let msg = ""; try { msg = (await res.json()).error?.message || ""; } catch(e){} throw {code: res.status===401||res.status===403 ? "bad_key" : res.status===429 ? "rate_limited" : "upstream_error", message: msg || ("HTTP " + res.status)}; }
    const data = await res.json();
    const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    if (!text) throw {code:"empty_completion", message:"Empty reply"};
    opts.onText && opts.onText({text, delta:text});
    return {text, truncated: data.stop_reason==="max_tokens"};
  }
  call.json = async (input, opts={}) => {
    const {text} = await call(input + "\n\nReply with only the JSON value, no other text.", opts);
    const tries = [text, (text.match(/```(?:json)?\s*([\s\S]*?)```/)||[])[1], text.slice(Math.min(...["{","["].map(c=>{const i=text.indexOf(c);return i<0?1e9:i;})), Math.max(text.lastIndexOf("}"), text.lastIndexOf("]"))+1)];
    for (const t of tries) { if (!t) continue; try { return JSON.parse(t); } catch(e){} }
    throw {code:"invalid_json", message:"Could not parse JSON", text};
  };
  return call;
}

function engagementBand(c){ const e = Number(c.engagement)||0; return e>=60?"High engagement":e>=25?"Medium engagement":"Low engagement"; }
function segmentsOf(c){
  const s = [];
  if (c.vertical==="Nutra"||c.vertical==="Both") s.push("Nutra wellness");
  if (c.vertical==="Pet"||c.vertical==="Both") s.push("Pet wellness");
  if (c.country==="USA") s.push("Market: USA"); else if (c.country==="UK") s.push("Market: UK"); else if (c.country) s.push("Market: Europe/Other");
  s.push(engagementBand(c));
  (c.interests||[]).forEach(i => s.push("Interest: " + i.toLowerCase()));
  if (c.consentEmail && !c.suppressed && c.stage!=="Unsubscribed") s.push("Emailable");
  if (c.stage==="Dormant") s.push("Re-engagement");
  if (c.followUp && c.followUp <= day(now())) s.push("Follow-up due");
  return s;
}

/* ---------- rule-based learning signals (work without AI) ---------- */
function ruleSignals(){
  const out = [];
  const offers = all("offers"), content = all("content"), contacts = all("contacts");
  offers.filter(o=>o.status==="Approved").forEach(o => out.push({p:1, t:`“${o.name}” is approved but not active`, w:"Verify promotional permissions and send the activation signal in the Approval Gateway.", go:"approvals"}));
  offers.filter(o=>o.status==="Shortlisted").forEach(o => out.push({p:2, t:`Apply to ${o.network} for “${o.name}”`, w:`Shortlisted${o.score?` with score ${o.score}`:""}. Apply manually, then set status to Approval pending.`, go:"approvals"}));
  content.filter(c=>c.offerId && !isActiveOffer(byId("offers",c.offerId)) && ["Approved","Published"].includes(c.status)).forEach(c => out.push({p:1, t:`“${c.title}” promotes an offer that is not active`, w:"Unpublish or relink this content — inactive offers must not be promoted.", go:"content"}));
  content.filter(c=>c.status==="Needs update").forEach(c => out.push({p:2, t:`Refresh “${c.title}”`, w:"Marked as needing update.", go:"content"}));
  content.filter(c=>c.status==="In review").forEach(c => out.push({p:3, t:`Review “${c.title}”`, w: c.factsVerified ? "Facts verified — ready to approve." : "Facts and claims not yet verified by a person.", go:"content"}));
  const activeOffers = offers.filter(isActiveOffer);
  activeOffers.forEach(o => { if (!content.some(c=>c.offerId===o.id)) out.push({p:2, t:`Active offer “${o.name}” has no website content`, w:"Generate a review, comparison or buying guide in Content Studio.", go:"content"}); });
  const needs = count(contacts, c => (c.interests||[]).map(x=>x.toLowerCase()));
  Object.entries(needs).sort((a,b)=>b[1]-a[1]).slice(0,4).forEach(([k,n]) => {
    const hasOffer = offers.some(o => (o.category+" "+o.name).toLowerCase().includes(k) && ["Active","Approved","Approval pending","Shortlisted"].includes(o.status));
    const hasContent = content.some(c => (c.title+" "+(c.keywords||"")).toLowerCase().includes(k));
    if (!hasOffer) out.push({p:2, t:`${n} customer(s) interested in “${k}” — no offer in pipeline`, w:"Run offer discovery for this need.", go:"offers"});
    if (!hasContent) out.push({p:3, t:`No website content covers “${k}”`, w:"Customer interest without matching content is a content gap.", go:"content"});
  });
  const due = contacts.filter(c => c.followUp && c.followUp <= day(now()) && c.stage!=="Unsubscribed");
  if (due.length) out.push({p:2, t:`${due.length} lead follow-up(s) due`, w:"Open Segments & Leads → Follow-up due.", go:"segments"});
  const noConsent = contacts.filter(c => c.email && !c.consentEmail).length;
  if (noConsent) out.push({p:3, t:`${noConsent} contact(s) have an email but no consent record`, w:"They are excluded from email sync until consent is recorded.", go:"crm"});
  all("platforms").filter(p=>p.accountStatus==="To confirm"||p.accountStatus==="To verify").forEach(p => out.push({p:3, t:`Confirm ${p.name} account access`, w:p.notes||"Verify programme access and available APIs.", go:"setup"}));
  return out.sort((a,b)=>a.p-b.p);
}

VIEWS.dashboard = () => {
  const offers = all("offers"), content = all("content"), contacts = all("contacts");
  const st = count(offers, o=>o.status);
  const colors = {"Discovered":"var(--muted)","Under evaluation":"var(--info)","Shortlisted":"var(--info)","Approval pending":"var(--warn)","Approved":"var(--accent)","Active":"var(--good)","Paused":"var(--warn)","Rejected":"var(--bad)","Expired / withdrawn":"var(--bad)"};
  const total = offers.length || 1;
  const sig = ruleSignals().slice(0,8);
  const openIns = all("insights").filter(i=>i.status!=="Dismissed"&&i.status!=="Actioned").slice(0,5);
  const published = content.filter(c=>c.status==="Published").length;
  const live = LOOP.map(([l,goId,c],i)=>`<div class="st" data-go="${goId}"><b>${l}</b><span>${c?S[c].size+" records":"gateway"}</span></div>${i<LOOP.length-1?'<span class="ar">→</span>':''}`).join("") + `<span class="ar">↺</span><div class="st back" data-go="offers"><b>Improved offers & content</b><span>loop restarts</span></div>`;
  return header("Command Center","MWC 360° operating loop","Every module feeds the next. Research shapes offers, approved offers shape content, customers shape the next round of research.",
    `<button class="btn ai p" data-act="runLearning" ${aiReady()?"":"disabled"}>Run learning cycle</button>`) +
  loadingNote() +
  `<div class="grid g4">
    <div class="card stat"><div class="v">${S.research.size + S.ads.size + S.competitors.size}</div><div class="l">Intelligence records</div></div>
    <div class="card stat"><div class="v">${offers.filter(isActiveOffer).length}<span class="muted" style="font-size:16px"> / ${offers.length}</span></div><div class="l">Active offers / in pipeline</div></div>
    <div class="card stat"><div class="v">${published}<span class="muted" style="font-size:16px"> / ${content.length}</span></div><div class="l">Pages published / planned</div></div>
    <div class="card stat"><div class="v">${contacts.filter(emailable).length}<span class="muted" style="font-size:16px"> / ${contacts.length}</span></div><div class="l">Emailable / total contacts</div></div>
  </div>
  <div class="card"><h3>The 360° loop <small>click a stage to open it</small></h3><div class="loop">${live}</div></div>
  <div class="grid g2">
    <div class="card"><h3>Offer pipeline</h3>
      ${offers.length ? `<div class="bar">${OFFER_STATUSES.filter(s=>st[s]).map(s=>`<i style="width:${st[s]/total*100}%;background:${colors[s]}" title="${s}: ${st[s]}"></i>`).join("")}</div>
      <div class="legend">${OFFER_STATUSES.filter(s=>st[s]).map(s=>`<span><i style="background:${colors[s]}"></i>${s} ${st[s]}</span>`).join("")}</div>` : `<p class="muted">No offers yet. Start in Offer Pipeline.</p>`}
      <div class="note" style="margin-top:12px">Only <b>Active</b> offers can be promoted. Activation needs a person to confirm approval in the Approval Gateway.</div>
    </div>
    <div class="card"><h3>Next best actions <small>from live data</small></h3>
      ${sig.length ? sig.map(s=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)"><span class="pill ${s.p===1?"bad":s.p===2?"warn":"mute"}">P${s.p}</span><div style="min-width:0;flex:1"><div class="t">${esc(s.t)}</div><div class="sub muted">${esc(s.w)}</div></div><button class="btn s" data-go="${s.go}">Open</button></div>`).join("") : `<p class="muted">Nothing needs attention right now.</p>`}
    </div>
  </div>
  <div class="card"><h3>Open intelligence <small>from chatbot, email and the learning engine</small></h3>
    ${openIns.length ? openIns.map(i=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="tag">${esc(i.kind||"Insight")}</span><span class="tag">${esc(i.source||"")}</span> ${esc(i.text)}</div>`).join("") : `<p class="muted">Insights appear here after chatbot sessions and learning cycles.</p>`}
  </div>`;
};

VIEWS.automation = () => {
  if (!API_MODE) return header("Automation","Automation & tasks","Scheduled automation runs on the MWC 360 server. Open the console at your server's /admin address to see jobs and run them.","") + emptyState("Not connected to the server","This copy of the console is not running on the MWC 360 server.","");
  const jobs = AUTO.jobs || []; const open = all("tasks").filter(t=>t.status==="Open");
  return header("Automation","Automation & tasks","The 360° loop runs on a schedule. Each job's last result is shown; run any job now. Tasks are the steps that need a person.",`<button class="btn" data-act="refreshJobs">Refresh</button>`) +
  `<div class="card"><h3>Human tasks <small>${open.length} open</small></h3>${open.length? table([
    {h:"Task",f:t=>`<div class="t">${esc(t.title)}</div><div class="sub">${esc(t.detail||"")}</div>`},{h:"Priority",f:t=>pill(t.priority==="High"?"Open":"Not started").replace(/Open|Not started/, esc(t.priority||""))},{h:"Role",f:t=>esc(t.role||"editor")},
    {h:"Where",f:t=>t.module?`<button class="btn s" data-go="${esc(t.module)}">${esc((MODULES.find(m=>m.id===t.module)||{}).label||t.module)}</button>`:""},

    {h:"Job",f:j=>`<div class="t">${esc(j.name)}</div><div class="sub">${esc(j.stage)}</div>`},{h:"Schedule",f:j=>`<code>${esc(j.cron)}</code>`},
    {h:"Last run",f:j=>j.last?`${pill(j.last.status==="ok"?"Done":j.last.status==="running"?"In progress":"Rejected").replace(/Done|In progress|Rejected/, esc(j.last.status))}<div class="sub">${esc((j.last.finished_at||j.last.started_at||"").replace("T"," ").slice(0,16))}</div>`:"<span class='muted'>never</span>"},

VIEWS.structure = () => {

  const tree = (pl) => { const cats = pl.categories||[]; const top = cats.filter(c=>!c.parent); return top.map(t=>`<div style="margin:4px 0"><b>${esc(t.name)}</b> <span class="tag">${esc(t.kind||"")}</span>${cats.filter(c=>c.parent===t.slug).map(c=>`<div style="margin-left:18px">↳ ${esc(c.name)} <span class="tag">${esc(c.kind||"")}</span></div>`).join("")}</div>`).join(""); };
  const menu = (pl) => (pl.menu||[]).map(m=>`<div>• ${esc(m.title)}${(m.children||[]).length?`<div style="margin-left:18px">${m.children.map(c=>`◦ ${esc(c.title)}`).join("<br>")}</div>`:""}</div>`).join("");
  return header("06b · Website structure","Site structure","Each month AI proposes need-based navigation, product categories, category pages and homepage sections, using research, customer needs, search data and competitor patterns. Nothing changes on the website until an approver applies the plan.",
    API_MODE?`<button class="btn ai p" data-act="proposeStructure">Propose structure now</button>`:"") + loadingNote() +
  (cur ? `<div class="card"><h3>Proposed plan <small>${esc(day(cur.proposedAt||cur.createdAt))}</small></h3>
    <div class="flow"><span class="on">${(cur.diff?.newCategories||[]).length} new categories</span><span>${(cur.diff?.keptCategories||[]).length} kept</span><span>${esc(cur.diff?.menuItems||0)} menu items</span><span>${esc(cur.diff?.assignments||0)} post assignments</span></div>
    <div class="grid g3" style="margin-top:12px"><div><div class="eyebrow">Categories</div>${tree(cur.plan||{})}</div><div><div class="eyebrow">Main menu</div>${menu(cur.plan||{})}</div><div><div class="eyebrow">Homepage & category pages</div>${[...(cur.plan?.homepageSections||[]).map(s=>"Homepage: "+s.title), ...(cur.plan?.categoryPages||[]).map(s=>s.title)].map(t=>`<div>• ${esc(t)}</div>`).join("")}</div></div>
    ${cur.plan?.rationale?`<p class="muted">${esc(cur.plan.rationale)}</p>`:""}
    ${API_MODE?`<div class="row" style="margin-top:10px"><button class="btn p" data-plan="${cur.id}|apply">Apply to WordPress</button><button class="btn danger" data-plan="${cur.id}|reject">Reject</button></div><div class="note" style="margin-top:10px">Applying creates the categories, assigns published posts, builds the menu and queues homepage and category-page copy as content drafts for review.</div>`:""}</div>`
    : emptyState("No plan waiting for approval","The next plan is proposed on the 1st of each month, or click “Propose structure now”.","")) +

VIEWS.ads = () => {

  const bars = (obj) => { const mx = Math.max(1,...Object.values(obj)); return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hbar"><span class="k">${esc(k)}</span><span class="tr"><i style="width:${v/mx*100}%"></i></span><span class="n">${v}</span></div>`).join("") || `<p class="muted">—</p>`; };

    {h:"Pain → trigger",f:a=>`${esc(a.pain)}<div class="sub">${esc(a.trigger)} · ${esc(a.story)}</div>`},

    {h:"Source",f:a=>a.source?`<a href="${esc(a.source)}" target="_blank" rel="noopener">view</a>`:"—"},

const CLAIM_WORDS = ["cure","cures","treat","treats","prevent disease","prevents","guaranteed","miracle","fda approved","clinically proven","detox","100% safe","no side effects","lose \\d+ ?(lbs|pounds|kg)","reverse"];
function claimFlags(t){ const s = String(t||"").toLowerCase(); return CLAIM_WORDS.filter(w => new RegExp("\\b"+w+"\\b").test(s)); }

function chatRules(){
  const offers = all("offers").filter(isActiveOffer).map(o=>`- ${o.name} (${o.vertical}; ${o.category}; markets ${o.markets})`).join("\n") || "- (no active offers yet — do not recommend specific products)";
  const pages = all("content").filter(c=>c.status==="Published").slice(0,25).map(c=>`- ${c.title} [${c.type}] ${c.wpUrl||""}`).join("\n") || "- (no published pages yet)";
  return `${BRAND_RULES}
You are the MWC website assistant. Two goals: (1) help visitors warmly and briefly, (2) learn about them for primary research: their needs, problems, interests, product preferences, buying considerations, country/market, expectations from MWC, unmet needs and suggestions. Ask at most one natural question per reply. Keep replies under 90 words.
Only recommend these ACTIVE offers, and only when relevant:\n${offers}
Point to these verified MWC pages where helpful:\n${pages}
Never give medical diagnoses; suggest seeing a doctor or vet for health concerns. Never ask for email yourself — the site shows a consent form for that.`;
}

const SNIP = {
gtm:`// Add to the site via GTM (Sanjay). Fire on key MWC actions.
window.dataLayer = window.dataLayer || [];
function mwcTrack(event, params){ dataLayer.push({event, ...params}); }

// Affiliate link click (add data-offer-id to every affiliate link)
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-offer-id]');
  if (a) mwcTrack('affiliate_click', {
    offer_id: a.dataset.offerId, network: a.dataset.network,
    page_type: document.body.dataset.pageType });
});
// Others: chatbot_open, chatbot_lead (consent=true),
// newsletter_signup, lead_magnet_download, comparison_view
// GA4: mark affiliate_click + newsletter_signup as key events.
// Meta Pixel: map newsletter_signup -> Lead.`,
widget:`<!-- WordPress: Appearance > Theme File Editor > footer, or WPCode -->
<div id="mwc-chat"></div>
<script>
  window.MWC_CHAT = {
    endpoint: 'https://api.mywellnesscommunity.com/chat', // Preeti's backend
    consentText: 'I agree to receive wellness tips and offers from ' +
      'My Wellness Community by email. I can unsubscribe at any time.',
    privacyUrl: '/privacy-policy/'
  };
<\/script>
<script src="https://api.mywellnesscommunity.com/widget.js" defer><\/script>
<!-- Backend contract (POST /chat): {sessionId, message, page}
     -> {reply}. POST /chat/lead: {sessionId, name, email,
     consent:true, consentText, page} -> creates CRM contact. -->`,
mailerlite:`// Server-side only (API key in env / secrets manager).
// Push ONLY consented, non-suppressed contacts.
async function syncContact(c, groupIds) {
  const res = await fetch('https://connect.mailerlite.com/api/subscribers', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json', Accept: 'application/json',
      Authorization: 'Bearer ' + process.env.MAILERLITE_API_KEY },
    body: JSON.stringify({

/* ---------- modals ---------- */
function openModal(html, onBind){
  modalOpen = true;
  $("#modalRoot").innerHTML = `<div class="modal" id="modal"><div class="box">${html}</div></div>`;
  $("#modal").addEventListener("click", e => { if (e.target.id==="modal" || e.target.closest("[data-close]")) closeModal(); });
  onBind && onBind($("#modal"));
  const first = $("#modal input, #modal select, #modal textarea"); first && first.focus();
}
function closeModal(){ modalOpen = false; $("#modalRoot").innerHTML = ""; if (dirty) render(); }
document.addEventListener("keydown", e => { if (e.key==="Escape" && modalOpen) closeModal(); });

function fieldHtml(f, v){
  const id = "f_"+f.k; const w = f.wide?"wide":"";
  if (f.t==="check") return `<label class="ck ${w}"><input type="checkbox" id="${id}" ${v?"checked":""}> ${esc(f.l)}</label>`;
  let inner;
  if (f.t==="textarea") inner = `<textarea id="${id}" ${f.big?'style="min-height:220px"':""} placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
  else if (f.t==="select") inner = `<select id="${id}"><option value=""></option>${f.o.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if (f.t==="multi") inner = `<div class="row" id="${id}">${f.o.map(o=>`<label class="ck" style="font-size:12.5px"><input type="checkbox" value="${esc(o)}" ${(v||[]).includes(o)?"checked":""}>${esc(o)}</label>`).join("")}</div>`;
  else if (f.t==="offer") inner = `<select id="${id}"><option value="">— Informational (no offer) —</option>${all("offers").map(o=>`<option value="${o.id}" ${o.id===v?"selected":""} ${isActiveOffer(o)?"":"disabled"}>${esc(o.name)} (${esc(o.status)})</option>`).join("")}</select><span style="font-size:11.5px">Only Active offers can be selected.</span>`;
  else if (f.t==="content") inner = `<select id="${id}"><option value=""></option>${all("content").map(c=>`<option value="${c.id}" ${c.id===v?"selected":""}>${esc(c.title)}</option>`).join("")}</select>`;
  else if (f.t==="segment") inner = `<select id="${id}"><option value="">All emailable</option>${Object.keys(segmentSummary()).map(s=>`<option ${s===v?"selected":""}>${esc(s)}</option>`).join("")}</select>`;
  else if (f.t==="tags") inner = `<input id="${id}" value="${esc((v||[]).join(", "))}">`;
  else inner = `<input id="${id}" type="${f.t==="number"?"number":f.t==="date"?"date":f.t==="url"?"url":"text"}" value="${esc(v)}" placeholder="${esc(f.ph||"")}">`;
  return `<label class="f ${w}">${esc(f.l)}${inner}</label>`;
}
function readForm(schema, root){
  const o = {};
  schema.forEach(f => { const el = root.querySelector("#f_"+f.k); if (!el) return;
    if (f.t==="check") o[f.k] = el.checked;
    else if (f.t==="multi") o[f.k] = [...el.querySelectorAll("input:checked")].map(i=>i.value);
    else if (f.t==="tags") o[f.k] = el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else if (f.t==="number") o[f.k] = el.value===""?null:Number(el.value);
    else o[f.k] = el.value.trim();
  });
  return o;
}
const TITLES = {communities:"community",research:"research finding",ads:"ad",competitors:"competitor site",offers:"offer",content:"content",social:"social post",contacts:"contact",campaigns:"campaign",metrics:"data point",platforms:"platform"};
function editRecord(c, id, preset={}){
  const obj = id ? {...byId(c,id)} : {...preset};
  const schema = SCHEMA[c];
  openModal(`<h2>${id?"Edit":"New"} ${TITLES[c]}</h2><div class="form">${schema.map(f=>fieldHtml(f,obj[f.k])).join("")}</div>
    <div id="formErr"></div>
    <div class="row" style="justify-content:space-between"><div>${id?`<button class="btn danger" data-del>Delete</button>`:""}</div><div class="row"><button class="btn" data-close>Cancel</button><button class="btn p" data-save>Save</button></div></div>`, m => {
    m.querySelector("[data-save]").onclick = async () => {
      const data = readForm(schema, m);
      const missing = schema.filter(f=>f.req && !data[f.k]);
      if (missing.length) { $("#formErr").innerHTML = `<div class="note bad">Fill in ${missing.map(f=>f.l).join(", ")}.</div>`; return; }
      if (c==="content" && data.status==="Published" && !data.factsVerified) { $("#formErr").innerHTML = `<div class="note bad">Tick “facts verified” before marking content as Published.</div>`; return; }
      if (c==="content" && data.offerId && !isActiveOffer(byId("offers",data.offerId))) { $("#formErr").innerHTML = `<div class="note bad">The linked offer is not Active. Activate it in the Approval Gateway first.</div>`; return; }
      if (c==="contacts") { if (data.consentEmail && !obj.consentEmail) data.consentAt = now(); if (data.stage==="Unsubscribed") data.suppressed = true; }
      if (c==="offers" && !id) data.status = "Discovered";
      const rec = await save(c, {...obj, ...data, example: obj.example && !id ? obj.example : obj.example});
      if (c==="offers" && !id) await audit("Offer discovered", "offer:"+rec.id, rec.name);
      closeModal(); toast("Saved");
    };
    const d = m.querySelector("[data-del]");
    if (d) d.onclick = () => { d.outerHTML = `<span class="row"><span class="muted">Delete permanently?</span><button class="btn danger" data-del2>Yes, delete</button></span>`; m.querySelector("[data-del2]").onclick = async () => { await del(c,id); closeModal(); toast("Deleted"); }; };
  });
}

async function moveOffer(id, next){
  const o = byId("offers", id); if (!o) return;
  if (next === "Active") return activationDialog(o);
  if (API_MODE) { try { const r = await apiFetch("POST",`/api/offers/${id}/transition`,{to:next}); S.offers.set(r.id,r); await reloadColl("content"); await reloadColl("audit"); scheduleRender(); toast(`${o.name}: ${next}`); } catch(e){ toast(e.message); } return; }
  const body = {...o, status: next};
  if (next==="Paused"||next==="Rejected"||next==="Expired / withdrawn") body.deactivatedAt = now();
  await save("offers", body);
  await audit(`Status → ${next}`, "offer:"+id, `${o.name} (was ${o.status})`);
  // demote content that promotes a no-longer-active offer
  if (["Paused","Rejected","Expired / withdrawn"].includes(next)) {
    for (const c of all("content").filter(c=>c.offerId===id && ["Approved","Published"].includes(c.status))) await save("content", {...c, status:"Needs update", hold:`Offer ${next.toLowerCase()} on ${day(now())}`});

}

function mapCountry(s){ s=String(s||"").toLowerCase(); if (/us|united states|america/.test(s)) return "USA"; if (/uk|united kingdom|britain|england|scotland|wales/.test(s)) return "UK"; if (/german/.test(s)) return "Germany"; if (/france|french/.test(s)) return "France"; if (/netherland|dutch/.test(s)) return "Netherlands"; if (/ireland/.test(s)) return "Ireland"; return s ? "Other" : ""; }

async function draftMail(id){
  const c = byId("campaigns", id); if (!c) return;
  const seg = c.segment || "All emailable";
  const members = all("contacts").filter(x => emailable(x) && (!c.segment || segmentsOf(x).includes(c.segment)));
  const interests = count(members, m=>m.interests||[]);
  const pages = all("content").filter(x=>x.status==="Published").slice(0,15).map(x=>`${x.title} ${x.wpUrl||""}`);
  const offers = all("offers").filter(isActiveOffer).map(o=>`${o.name} (${o.category})`);
  aiPanel(`${BRAND_RULES}\n\nWrite a ${c.type} email for MWC.\nCampaign: ${c.name}\nSegment: ${seg} (${members.length} consented subscribers; top interests ${JSON.stringify(interests)})\nVerified pages to link: ${pages.join("; ")||"none yet"}\nActive offers allowed: ${offers.join("; ")||"none — keep it educational"}\nGive: 3 subject line options, preview text, the email body (short, warm, useful, one clear CTA, merge field {$name}), affiliate disclosure if an offer is mentioned, and the required unsubscribe footer line. If it is a sequence type, outline each email in the sequence with day offsets.`);
}

async function sendChat(text){
  if (CHAT.busy || !text) return;
  if (API_MODE) {
    CHAT.busy = true; CHAT.turns.push({role:"user", content:text});
    const box = $("#msgs"); box.innerHTML = chatMsgsHtml() + `<div class="msg a">…</div>`; box.scrollTop = box.scrollHeight;
    try { const r = await fetch("/public/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:CHAT.sessionId, message:text, page:"/admin (test)"})}).then(r=>r.json()); if (r.error) throw new Error(r.error); CHAT.sessionId = r.sessionId; CHAT.turns.push({role:"assistant", content:r.reply}); }
    catch(e){ CHAT.turns.push({role:"assistant", content:"("+e.message+")"}); }
    CHAT.busy = false; const b2=$("#msgs"); if (b2){ b2.innerHTML = chatMsgsHtml(); b2.scrollTop=b2.scrollHeight; } const eb=document.querySelector('[data-act="endChat"]'); if (eb) eb.disabled=false; return;
  }
  CHAT.busy = true; CHAT.turns.push({role:"user", content:text});
  const box = $("#msgs"); box.innerHTML = chatMsgsHtml() + `<div class="msg a" id="pending">…</div>`; box.scrollTop = box.scrollHeight;
  CHAT.ctl = new AbortController();
  try {
    const turns = [{role:"user", content: chatRules() + "\n\n(Conversation with a website visitor follows.)"}, ...CHAT.turns.slice(-16)];
    const r = await ai(turns, {...(SAMPLE?{cache:false}:{}), modelTier:"quick", signal:CHAT.ctl.signal, onText:({text})=>{ const p=$("#pending"); if(p){ p.textContent=text; box.scrollTop=box.scrollHeight; } }});
    CHAT.turns.push({role:"assistant", content:r.text});
  } catch(e){ CHAT.turns.push({role:"assistant", content: e.text || ("(" + aiErr(e) + ")")}); }
  CHAT.busy = false;
  const b2 = $("#msgs"); if (b2) { b2.innerHTML = chatMsgsHtml(); b2.scrollTop = b2.scrollHeight; }
  const eb = document.querySelector('[data-act="endChat"]'); if (eb) eb.disabled = !aiReady();
}

/* ---------- event binding ---------- */
function bindView(){
  const v = $("#view");
  v.querySelectorAll("[data-filter]").forEach(el => {
    const h = () => { filters[el.dataset.filter] = el.value; if (el.tagName==="INPUT") { clearTimeout(el._t); el._t = setTimeout(()=>{ render(); const n=$(`[data-filter="${el.dataset.filter}"]`); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} }, 250); } else render(); };
    el.addEventListener(el.tagName==="INPUT"?"input":"change", h);
  });
  v.querySelectorAll("[data-phase]").forEach(el => el.addEventListener("change", async () => { const p = byId("phases", el.dataset.phase); await save("phases", {...p, status: el.value}); toast("Phase updated"); }));
  const cf = $("#chatForm"); if (cf) cf.addEventListener("submit", e => { e.preventDefault(); const i=$("#chatIn"); const t=i.value.trim(); i.value=""; sendChat(t); });
  ["leadName","leadEmail","leadConsent"].forEach(id => { const el = $("#"+id); if (el) el.addEventListener("change", () => { CHAT.lead = {name:$("#leadName").value, email:$("#leadEmail").value, consent:$("#leadConsent").checked}; }); });
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-new],[data-edit],[data-act],[data-offer],[data-eval],[data-move],[data-content],[data-contact],[data-seg],[data-ins],[data-draftmail],[data-sendmail],[data-runjob],[data-task],[data-plan]");
  if (!t || t.disabled) return;
  if (t.closest("#modal")) return; // modal binds its own
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.new) return editRecord(d.new, null, d.new==="social"?{status:"Planned"}:d.new==="contacts"?{stage:"New"}:d.new==="campaigns"?{status:"Draft"}:{});
  if (d.edit) { const [c,id] = d.edit.split(":"); return editRecord(c,id); }
  if (d.act) return ACTIONS[d.act] && ACTIONS[d.act]();
  if (d.offer) return openOffer(d.offer);
  if (d.content) return openContent(d.content);
  if (d.contact) return openContact(d.contact);
  if (d.draftmail) return draftMail(d.draftmail);
  if (d.sendmail) { const cm = byId("campaigns", d.sendmail); return openModal(`<h2>Send “${esc(cm.name)}”?</h2><p class="muted" style="margin:0">Sends through MailerLite to the consented members of <b>${esc(cm.segment||"All emailable")}</b>. Suppressed contacts are excluded.</p><div id="smE"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn p" id="smGo">Send now</button></div>`, () => { $("#smGo").onclick = async () => { try { const r = await apiFetch("POST",`/api/campaigns/${cm.id}/send`); S.campaigns.set(r.id,r); closeModal(); toast(r.status==="Sending"?"Campaign sending":"Campaign approved"); } catch(e){ $("#smE").innerHTML = `<div class="note bad">${esc(e.message)}</div>`; } }; }); }
  if (d.plan) { const [id,act] = d.plan.split("|"); return apiFetch("POST",`/api/plans/${id}/${act}`,{}).then(r=>{ toast(act==="apply"?`Applied: ${r.categoriesCreated} categories, ${r.menuItems} menu items${r.warnings?.length?' — '+r.warnings[0]:''}`:"Plan rejected"); reloadAll(); }).catch(e=>toast(e.message)); }
  if (d.runjob) { t.disabled = true; t.textContent = "Running…"; return apiFetch("POST",`/api/jobs/${d.runjob}/run`).then(r=>{ toast(`${d.runjob}: done`); reloadAll(); }).catch(e=>{ toast(e.message); reloadAll(); }); }
  if (d.task) { const [id,s] = d.task.split("|"); const tk = byId("tasks",id); if (tk) save("tasks",{...tk, status:s}); return; }
  if (d.seg) { filters.segments = d.seg; return render(); }
  if (d.ins) { const [id,s] = d.ins.split("|"); const i = byId("insights",id); if (i) save("insights", {...i, status:s}); return; }
  if (d.move) { const [id,n] = d.move.split("|"); return moveOffer(id,n); }
  if (d.eval) return evaluateOffer(d.eval, t);
});
$("#mnavSel").addEventListener("change", e => go(e.target.value));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h!==view) go(h); });

async function evaluateOffer(id, btn){
  const o = byId("offers", id); if (!o) return;
  btn.disabled = true; btn.textContent = "Evaluating…";
  if (API_MODE) { try { const r = await apiFetch("POST",`/api/offers/${id}/evaluate`); S.offers.set(r.id,r); toast(`${o.name}: ${r.score}/100`); openOffer(id); } catch(e){ toast(e.message); btn.disabled=false; btn.textContent="Evaluate"; } return; }
  try { const ev = await aiJson(`${BRAND_RULES}\n\nEvaluate this affiliate offer for MWC against market demand and customer data. Score 0-100 where demand fit and customer need matter most, then reputation/verifiability, programme terms, permitted traffic, promotional materials and content opportunity. Penalise unverifiable claims and missing information. Reply with only JSON {"score":number, "demandFit":string, "customerNeed":string, "reputation":string, "terms":string, "trafficFit":string, "contentOpportunities":string, "risks":string, "missingInfo":string, "recommendation":"Shortlist"|"Needs more research"|"Reject"}.\n\nOffer: ${JSON.stringify({name:o.name,network:o.network,vertical:o.vertical,category:o.category,markets:o.markets,commission:o.commission,metric:o.metric,reputation:o.reputation,traffic:o.traffic,materials:o.materials,demandEvidence:o.demandEvidence,notes:o.notes})}\n\nMWC context: ${systemSnapshot(8)}`);
    const score = Math.max(0, Math.min(100, Math.round(Number(ev.score)||0)));
    const body = {...byId("offers",id), score, evaluation: ev};
    if (body.status === "Discovered") body.status = "Under evaluation";
    await save("offers", body); await audit("AI evaluation", "offer:"+id, `${o.name}: ${score}/100 — ${ev.recommendation||""}`);
    toast(`${o.name}: ${score}/100`); openOffer(id);
  } catch(e){ toast(aiErr(e)); btn.disabled = false; btn.textContent = "Evaluate"; }
}

/* ---------- boot ---------- */
async function boot(){
  const h = location.hash.slice(1); if (MODULES.some(m=>m.id===h)) view = h;
  loadKeyAi();
  if (API_MODE) {
    try { TOKEN = localStorage.getItem("mwc360_token"); } catch(e){}
    const start = async () => { try { const me = await apiFetch("GET","/api/me"); whoName = me.name; dbState = `server (${me.name}, ${me.role})`; await reloadAll(); AUTO.jobs = await apiFetch("GET","/api/jobs").catch(()=>[]); render(); setInterval(()=>{ if(!modalOpen) reloadAll(); }, 30000); } catch(e){ askToken(e.message); } };
    const askToken = (msg) => openModal(`<h2>Sign in to MWC 360</h2><p class="muted" style="margin:0">Paste your personal API token (created by an admin with <code>npm run create-admin</code> or the Users API).</p><label class="f">API token<input id="tk" type="password" autocomplete="off"></label>${msg&&TOKEN?`<div class="note bad">${esc(msg)}</div>`:""}<div class="row" style="justify-content:flex-end"><button class="btn p" id="tkGo">Sign in</button></div>`, () => { $("#tkGo").onclick = () => { TOKEN = $("#tk").value.trim(); try{localStorage.setItem("mwc360_token",TOKEN);}catch(e){} closeModal(); start(); }; });
    dbState = "connecting"; render();
    if (TOKEN) start(); else askToken("");
    return;
  }
  if (!window.claude || !window.claude.use) { dbState = "local (this browser)"; loadLocal(); render(); return; }
  render();
  claude.use("sample").then(s => { SAMPLE = s; if (!dirty) scheduleRender(); else renderRail(); });
  claude.use("user").then(async u => { USER = u; try { const me = await u?.me?.(); if (me?.name) whoName = me.name; } catch(e){} });
  const db = await claude.use("db");
  if (!db) { dbState = "local (this browser)"; loadLocal(); render(); return; }
  DB = db; let pending = new Set(COLLS);
  const timer = setTimeout(() => { if (pending.size) { dbState = "slow — data may be out of date"; scheduleRender(); } }, 10000);
  COLLS.forEach(c => {
    db.collection(c).onSnapshot(snap => {
      S[c] = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
      if (!snap.metadata.fromCache) { pending.delete(c); if (!pending.size) { clearTimeout(timer); dbState = "connected"; } }
      scheduleRender();
    }, err => { clearTimeout(timer); dbState = "error: " + err.code; scheduleRender(); });
  });
}
boot();
</script>
